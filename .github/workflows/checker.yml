name: List.am Apartment Bot

on:
  schedule:
    - cron: '*/20 * * * *' # Проверка каждые 20 минут
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  run-parser:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python main.py

      - name: Commit updated seen ads
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ads.json
          git diff --staged --quiet || git commit -m "Update seen list.am ads [skip ci]"
          git push
